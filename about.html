    <!-- Fail-loud guard: registered before anything else so the page can never
         fail silently to a blank screen again. Surfaces script/runtime errors,
         CDN load failures, and the "nothing rendered" case as a visible overlay. -->
    <script>
        (function () {
            function showError(title, detail) {
                if (document.getElementById('__boot_error__')) return;
                var pre = document.createElement('pre');
                pre.id = '__boot_error__';
                pre.style.cssText = 'position:fixed;inset:0;z-index:99999;margin:0;padding:24px;'
                    + 'background:#050505;color:#ff6b6b;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;'
                    + 'white-space:pre-wrap;overflow:auto;';
                pre.textContent = '⚠ ' + title + '\n\n' + (detail || '')
                    + '\n\nOpen the browser console for the full stack trace.';
                (document.body || document.documentElement).appendChild(pre);
            }
            window.addEventListener('error', function (e) {
                if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                    showError('A required resource failed to load (check your internet connection)',
                        e.target.src || e.target.href || '');
                } else {
                    showError('The page failed to load',
                        (e.message || e.error || '') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
                }
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                showError('The page failed to load',
                    (e.reason && (e.reason.message || e.reason)) || 'Unhandled promise rejection');
            });
            var origConsoleError = console.error.bind(console);
            console.error = function () {
                var msg = Array.prototype.map.call(arguments, function (a) {
                    return (a && (a.stack || a.message)) || String(a);
                }).join(' ');
                if (/error|exception|cannot|undefined|failed|unexpected/i.test(msg)) {
                    showError('A script error occurred', msg);
                }
                return origConsoleError.apply(null, arguments);
            };
            window.addEventListener('load', function () {
                setTimeout(function () {
                    var root = document.getElementById('root');
                    if (root && root.childElementCount === 0) {
                        showError('The app did not render',
                            '#root is still empty after load. A script likely failed to load (CDN/network) or a runtime error occurred before render.');
                    }
                }, 4000);
            });
        })();
    </script>

    <script>

                document.documentElement.classList.toggle('dark', dark);
            } catch (e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <style>
        /* Custom Utilities */
        body {
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        /* The custom cursor hides the native pointer, so keyboard users get no
           hover affordance at all. A loud focus ring is non-negotiable here. */
        :focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 3px;
            border-radius: 2px;
        }

        /* Skip link — visible only once focused */
        .skip-link {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -120%);
            z-index: 100;
            padding: 12px 20px;
            background: #3b82f6;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 0 0 8px 8px;
            transition: transform 0.2s ease;
        }
        .skip-link:focus {
            transform: translate(-50%, 0);
        }

        /* Prevents the page scrolling behind the open mobile menu */
        body.menu-open {
            overflow: hidden;
        }

        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Noise Texture */
        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Custom Cursor */
        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #3b82f6;
        }
        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(59, 130, 246, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* Mobile: Restore default cursor */
        @media (max-width: 768px) {
            body {
                cursor: auto;
            }
            .cursor-dot,
            .cursor-outline {
                display: none;
            }
        }

        /* === ABOUT PAGE SPECIFIC === */

        /* Editorial image hover */
        .about-img {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
        }
        .about-img:hover {
            transform: scale(1.02);
        }

        /* Subtle blue line accent */
        .blue-line {
            display: block;
            flex: none;
            width: 32px;
            height: 2px;
            background: #3b82f6;
            border-radius: 1px;
        }

        /* Section 04 — asymmetric image composition */
        .editorial-grid-04 {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 16px;
            align-items: end;
        }
        @media (max-width: 768px) {
            .editorial-grid-04 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* Section 05 — mixed orientation composition */
        .editorial-grid-05 {
            display: grid;
            grid-template-columns: 0.45fr 0.55fr;
            gap: 16px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .editorial-grid-05 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .about-img {
                transition: none;
            }
            .about-img:hover {
                transform: none;
            }
        }
    </style>
</head>

        // --- Custom Cursor ---
        const CustomCursor = () => {
            const dotRef = useRef(null);
            const outlineRef = useRef(null);

            useEffect(() => {
                const onMouseMove = (e) => {
                    const { clientX, clientY } = e;
                    if (dotRef.current) {
                        dotRef.current.style.left = `${clientX}px`;
                        dotRef.current.style.top = `${clientY}px`;
                    }
                    if (outlineRef.current) {
                        outlineRef.current.animate({
                            left: `${clientX}px`,
                            top: `${clientY}px`
                        }, { duration: 500, fill: 'forwards' });
                    }
                };

                window.addEventListener('mousemove', onMouseMove);
                return () => window.removeEventListener('mousemove', onMouseMove);
            }, []);

            return (
                <>
                    <div ref={dotRef} className="cursor-dot hidden md:block mix-blend-difference"></div>
                    <div ref={outlineRef} className="cursor-outline hidden md:block mix-blend-difference"></div>
                </>
            );
        };

        // --- Scroll Reveal Hook ---
        const useScrollReveal = () => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReduced) {
                    setIsVisible(true);
                    return;
                }

                const observer = new IntersectionObserver(
                    entries => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                setIsVisible(true);
                                observer.unobserve(entry.target);
                            }
                        });
                    },
                    { threshold: 0.1 }
                );
                if (domRef.current) observer.observe(domRef.current);
                return () => {
                    if (domRef.current) observer.unobserve(domRef.current);
                };
            }, []);

            return [domRef, isVisible];
        };

            const [isDark, setIsDark] = useState(() =>
                document.documentElement.classList.contains('dark')
            );
            const [isOpen, setIsOpen] = useState(false);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', isDark);
                try {
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                } catch (e) {
                    /* private mode / storage disabled — theme just won't persist */
                }
            }, [isDark]);

            // Lock background scroll and allow Escape to dismiss the mobile menu.
            useEffect(() => {
                document.body.classList.toggle('menu-open', isOpen);
                if (!isOpen) return;
                const onKeyDown = (e) => { if (e.key === 'Escape') setIsOpen(false); };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [isOpen]);

        class ErrorBoundary extends React.Component {

            componentDidCatch(error, info) { console.error(error, info); }
            render() {
                if (this.state.error) {
                    return (
                        <div style={{ padding: '48px', maxWidth: '900px', margin: '0 auto', fontFamily: 'ui-monospace, Menlo, Consolas, monospace' }}>
                            <h1 style={{ fontSize: '20px', marginBottom: '16px' }}>Something went wrong rendering this page.</h1>
                            <pre style={{ whiteSpace: 'pre-wrap', color: '#b00020' }}>{String((this.state.error && this.state.error.stack) || this.state.error)}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
